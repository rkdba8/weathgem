name: Veille Immoweb + Gemini

on:
  workflow_dispatch:
  schedule:
    # Toutes les 5 minutes, décalé de 2 min pour éviter le pic au début de l'heure.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: immoweb-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run watcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_DAILY_SAFETY_CAP: "450"
          MAX_AI_CALLS_PER_RUN: "12"
          GEMINI_DELAY_SECONDS: "4.2"

          # Pendant les premiers tests : 1 = Telegram envoie aussi les rejets.
          # Passe à 0 après validation du comportement.
          NOTIFY_ALL: "1"

          # Laisse vide pour ne pas filtrer sur la date de disponibilité.
          DATE_CIBLE: ""
        run: python immoweb_watch.py

      - name: Persist seen + quota state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen.json gemini_usage.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi

          git commit -m "chore: update Immoweb watcher state [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
