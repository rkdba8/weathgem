name: Veille Immoweb + Gemini

on:
  workflow_dispatch:

  schedule:
    # 4 passages par jour, heure de Bruxelles.
    - cron: "7 8,12,19,23 * * *"
      timezone: "Europe/Brussels"

permissions:
  contents: write

concurrency:
  group: immoweb-watch
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  watch:

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Le script utilise channel="chrome".
      # Chrome est déjà présent sur le runner GitHub Ubuntu.
      - name: Check Chrome
        run: google-chrome --version

      - name: Smoke test Chrome with Playwright
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  channel="chrome",
                  headless=True,
              )
              page = browser.new_page()
              page.set_content("<html><body>Chrome OK</body></html>")
              print("✅ Chrome + Playwright OK")
              browser.close()
          PY

      - name: Run watcher
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_DAILY_SAFETY_CAP: "450"
          MAX_AI_CALLS_PER_RUN: "12"
          GEMINI_DELAY_SECONDS: "4.2"

          MAX_PAGES: "3"

          # Production : seulement CONTACTER + CONSIDERER.
          NOTIFY_ALL: "0"

          # Vide = pas de filtre sur la date de disponibilité.
          # Le filtre "publiée aujourd'hui" est indépendant
          # et est géré directement dans immoweb_watch.py.
          DATE_CIBLE: ""

        run: python immoweb_watch.py

      - name: Persist seen + quota state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen.json gemini_usage.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi

          git commit -m \
            "chore: update Immoweb watcher state [skip ci]"

          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
