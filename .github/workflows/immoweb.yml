name: Veille Immoweb + Gemini

on:
  workflow_dispatch:

  schedule:
    # Toutes les 5 minutes, décalé de 2 minutes.
    - cron: "2-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: immoweb-watch
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  watch:

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:

      # ---------------------------------------------------------
      # REPO
      # ---------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------------------------------------
      # PYTHON + CACHE PIP
      # ---------------------------------------------------------

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ---------------------------------------------------------
      # VERSION PLAYWRIGHT
      # Sert à invalider automatiquement le cache navigateur
      # si Playwright change de version.
      # ---------------------------------------------------------

      - name: Detect Playwright version
        id: playwright-version
        shell: bash
        run: |
          PW_VERSION="$(python -c 'import importlib.metadata; print(importlib.metadata.version("playwright"))')"
          echo "version=${PW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Playwright version: ${PW_VERSION}"

      # ---------------------------------------------------------
      # CACHE DU NAVIGATEUR PLAYWRIGHT
      # ---------------------------------------------------------

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-shell

      # ---------------------------------------------------------
      # DEPENDANCES SYSTEME
      #
      # On garde install-deps pour ne pas changer brutalement
      # l'environnement qui fonctionne actuellement.
      # ---------------------------------------------------------

      - name: Install Playwright system dependencies
        run: python -m playwright install-deps chromium

      # ---------------------------------------------------------
      # CHROMIUM
      #
      # Téléchargé uniquement si absent du cache.
      # --only-shell = uniquement la version utilisée en headless.
      # ---------------------------------------------------------

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --only-shell chromium

      # ---------------------------------------------------------
      # DEBUG CACHE
      # ---------------------------------------------------------

      - name: Playwright browser info
        run: |
          echo "Cache hit: ${{ steps.playwright-cache.outputs.cache-hit }}"
          python -m playwright install --list

      # ---------------------------------------------------------
      # SCRAPER
      # ---------------------------------------------------------

      - name: Run watcher
        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          GEMINI_MODEL: gemini-3.5-flash-lite

          GEMINI_DAILY_SAFETY_CAP: "450"

          MAX_AI_CALLS_PER_RUN: "12"

          GEMINI_DELAY_SECONDS: "4.2"

          MAX_PAGES: "3"

          # Tests :
          # 1 = envoie aussi les REJETER.
          # 0 = uniquement CONTACTER + CONSIDERER.
          NOTIFY_ALL: "1"

          DATE_CIBLE: ""

        run: python immoweb_watch.py

      # ---------------------------------------------------------
      # ETAT
      # ---------------------------------------------------------

      - name: Persist seen + quota state
        if: always()

        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add seen.json gemini_usage.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No state change to commit."
            exit 0
          fi

          git commit -m \
            "chore: update Immoweb watcher state [skip ci]"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          git push origin "HEAD:${GITHUB_REF_NAME}"
