- name: Cache Playwright browser
  id: playwright-cache
  uses: actions/cache@v4
  with:
    path: ~/.cache/ms-playwright
    key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-shell

- name: Install Playwright Chromium
  if: steps.playwright-cache.outputs.cache-hit != 'true'
  run: python -m playwright install --only-shell chromium

- name: Test Chromium
  id: chromium-test
  continue-on-error: true
  run: |
    python - <<'PY'
    from playwright.sync_api import sync_playwright

    with sync_playwright() as p:
        browser = p.chromium.launch(headless=True)
        print("Chromium OK")
        browser.close()
    PY

- name: Install Playwright system dependencies if needed
  if: steps.chromium-test.outcome == 'failure'
  run: python -m playwright install-deps chromium
